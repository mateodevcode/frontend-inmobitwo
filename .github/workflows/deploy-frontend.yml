name: Deploy Frontend & Tauri

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Deploy Frontend & Tauri to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 90m
          script: |
            set -e

            echo "🚀 Desplegando Frontend y Tauri..."

            cd /var/www/inmobitwo/frontend-inmobitwo

            echo "→ Descartando cambios locales no versionados..."
            git reset --hard HEAD
            git clean -fd

            echo "→ Actualizando código..."
            git fetch origin main
            git reset --hard origin/main

            echo "→ Commit desplegado:"
            git log -1 --oneline

            echo "→ Instalando dependencias..."
            npm ci

            echo "→ Construyendo aplicación web..."
            npm run build

            echo "→ Verificando que el build generó archivos nuevos..."
            ls -la dist/assets/ | head -5

            echo "→ Instalando Rust (si no está)..."
            if ! command -v cargo &> /dev/null; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              source $HOME/.cargo/env
            fi

            echo "→ Compilando Tauri para Linux..."
            npm run tauri build -- --target x86_64-unknown-linux-gnu

            echo "→ Copiando .AppImage a /releases..."
            cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage /var/www/inmobitwo/releases/app.AppImage 2>/dev/null || echo "⚠️ AppImage no encontrado"

            echo "→ Verificando archivos en /releases..."
            ls -la /var/www/inmobitwo/releases/

            echo "✅ Despliegue completado!"
