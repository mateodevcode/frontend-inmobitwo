name: Deploy Frontend & Tauri

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Deploy Frontend & Tauri to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 90m
          script: |
            set -e

            echo "🚀 Desplegando Frontend y Tauri..."

            cd /var/www/inmobitwo/frontend-inmobitwo

            echo "→ Limpiando cambios locales..."
            git reset --hard HEAD
            git clean -fd

            echo "→ Actualizando código..."
            git fetch origin main
            git reset --hard origin/main

            echo "→ Commit desplegado:"
            git log -1 --oneline

            echo "→ Instalando dependencias de Node..."
            npm ci

            echo "→ Construyendo aplicación web..."
            npm run build

            echo "→ Verificando build..."
            if [ -d "dist/assets/" ]; then
              echo "✅ Build generado correctamente"
              ls -la dist/assets/ | head -5
            else
              echo "❌ Error: dist/assets/ no existe"
              exit 1
            fi

            echo "→ Configurando Rust (si no está)..."
            if ! command -v cargo &> /dev/null; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              source $HOME/.cargo/env
            else
              echo "✅ Rust ya está instalado:"
              rustc --version
            fi

            source $HOME/.cargo/env

            echo "→ Compilando Tauri para Linux..."
            npm run tauri build -- --target x86_64-unknown-linux-gnu

            echo "→ Preparando directorio de releases..."
            mkdir -p /var/www/inmobitwo/releases

            echo "→ Buscando y copiando AppImage..."
            APPIMAGE_PATH=$(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/ -name "*.AppImage" 2>/dev/null | head -1)

            if [ -n "$APPIMAGE_PATH" ]; then
              cp "$APPIMAGE_PATH" /var/www/inmobitwo/releases/
              echo "✅ AppImage copiado exitosamente"
            else
              echo "⚠️  Advertencia: AppImage no encontrado"
            fi

            echo "→ Archivos finales en /releases:"
            ls -lh /var/www/inmobitwo/releases/

            echo "✅ Despliegue completado exitosamente!"
