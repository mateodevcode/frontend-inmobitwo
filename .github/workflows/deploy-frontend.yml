name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e  # detiene el script ante cualquier fallo

            echo "🚀 Desplegando Frontend..."

            cd /var/www/inmobitwo/frontend-inmobitwo

            echo "→ Descartando cambios locales no versionados..."
            git reset --hard HEAD
            git clean -fd

            echo "→ Actualizando código..."
            git fetch origin main
            git reset --hard origin/main

            echo "→ Commit desplegado:"
            git log -1 --oneline

            echo "→ Instalando dependencias..."
            npm ci

            echo "→ Construyendo aplicación..."
            npm run build

            echo "→ Verificando que el build generó archivos nuevos..."
            ls -la dist/assets/ | head -5

            echo "→ Recargando servidor web (si aplica)..."
            # Si usas nginx sirviendo estáticos directamente, normalmente no hace falta reload
            # porque los archivos se sobreescriben. Pero si usas PM2 para servir el frontend
            # (ej. con 'serve' o un server Node), descomenta:
            # pm2 restart frontend-inmobitwo

            echo "✅ Frontend desplegado correctamente!"
