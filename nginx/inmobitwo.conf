# === nginx: inmobitwo — inmobitwo.seventwo.tech (frontend Vite SPA estático) ===
# Build generado en el VPS: /srv/infra/inmobitwo/frontend-inmobitwo/dist (npm ci + npm run build)
# Certificado independiente: /etc/letsencrypt/live/inmobitwo.seventwo.tech/

# --- HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name inmobitwo.seventwo.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name inmobitwo.seventwo.tech;

    ssl_certificate /etc/letsencrypt/live/inmobitwo.seventwo.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inmobitwo.seventwo.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/infra/inmobitwo/frontend-inmobitwo/dist;
    index index.html;

    client_max_body_size 10M;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash de Vite: caché agresiva
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- WebSocket socket-core (VPS 127.0.0.1:3005) ---
    # Descomentar cuando el frontend empiece a usar wss://inmobitwo.seventwo.tech/ws
    # location /ws {
    #     proxy_pass http://127.0.0.1:3005;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 86400s;
    #     proxy_send_timeout 86400s;
    # }

    # --- SPA fallback (react-router) ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
